<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=900">
<title>{{TITLE}}</title>
<style>
/* 稳定视觉语言；组件按内容关系选择，不设配额。 */
:root{color-scheme:light;--paper:#fff;--canvas:#f2f5f7;--ink:#414b55;--heading:#242d35;--muted:#65717d;--accent:#c8562e;--orange:#ff8658;--line:#e9edf0;--blue:#23658b;--blue-wash:#edf7ff;--wash:#fff8e8}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased}
::selection{background:#ffddc8;color:var(--heading)}.paper{max-width:860px;margin:24px auto;padding:48px 46px 30px;background:var(--paper);border-radius:8px;box-shadow:0 8px 30px #25384b0b;position:relative}.paper:before{content:"";position:absolute;inset:0 0 auto;height:4px;border-radius:8px 8px 0 0;background:linear-gradient(90deg,#ff9d64,#a9a6ba)}.paper:after{content:"";display:block;margin-top:20px;height:3px;background:linear-gradient(90deg,#ff9d64,#a9a6ba)}
h1,h2,h3,p{margin:0}h1,h2,h3{color:var(--heading);text-wrap:pretty}h1{font-size:34px;line-height:1.45;font-weight:750;letter-spacing:0}.subtitle{text-wrap:balance;font-size:21px;font-weight:600;line-height:1.6;margin-top:12px;color:#4c5965}.lead{margin-top:20px;line-height:1.9}.meta{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.8}
section{margin-top:42px}section>h2{display:flex;align-items:baseline;gap:12px;font-size:24px;font-weight:750;line-height:1.55;padding-bottom:13px;border-bottom:1px solid var(--line);margin-bottom:21px}.num{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;flex-shrink:0;min-width:28px;height:28px;padding:0 5px;margin-top:5px;background:#424e58;border-radius:50%;color:white;font-size:16px;line-height:1;font-weight:650;font-variant-numeric:tabular-nums}h3{font-size:19px;font-weight:700;line-height:1.6;margin:27px 0 12px}h3:before{content:"";display:inline-block;width:8px;height:8px;margin-right:9px;margin-bottom:2px;border-radius:50%;background:var(--dot,var(--orange))}p+p{margin-top:14px}strong{font-weight:650;color:var(--heading)}ul,ol{padding-left:1.4em;margin:16px 0}li+li{margin-top:8px}li::marker{color:var(--accent)}a{color:var(--blue);text-underline-offset:4px}a:hover{color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.callout{margin:25px 0;padding:20px 24px;background:var(--blue-wash);border:1px solid #d2e8f8;border-left:4px solid #6db6e9;border-radius:7px;color:var(--blue)}.callout h3{margin:0 0 9px;color:var(--blue);font-size:18px}.callout h3:before{display:none}.callout strong{color:inherit}.keyline{margin:25px 0;padding:20px 24px;background:var(--wash);border-left:4px solid #f4c975;border-radius:6px;line-height:1.85}.keyline p,.keyline blockquote{margin:0}.keyline cite{display:block;font-size:13px;font-style:normal;margin-top:10px;color:var(--muted)}
.cards,.comparison,.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin:26px 0}.card,.comparison>div,.category{min-width:0;padding:22px 24px;background:#fff;border-radius:9px;box-shadow:0 4px 16px #25384b12}.card:nth-child(2n){--dot:#73ac45}.card h3,.comparison h3,.category h3{margin:0 0 11px;font-size:18px}.card p,.category p,.comparison p{font-size:16px;line-height:1.85}.categories{grid-template-columns:repeat(auto-fit,minmax(195px,1fr))}.category{border-top:3px solid #a8cf88;--dot:#73ac45;padding:18px 20px}.category:nth-child(3n+2){border-top-color:#ffc586;--dot:#ff8658}.category:nth-child(3n){border-top-color:#90cbe9;--dot:#479ece}.category ul{padding-left:1.2em}
.steps{list-style:none;counter-reset:step;padding:0;margin:24px 0}.steps>li{counter-increment:step;position:relative;padding-left:38px;margin:23px 0}.steps>li:before{content:counter(step);position:absolute;left:0;top:3px;width:25px;height:25px;border-radius:50%;background:var(--accent);color:white;text-align:center;line-height:25px;font-size:14px;font-weight:650}.steps h3{margin:0 0 7px}.steps h3:before{display:none}
.stats,.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px;margin:26px 0}.stats{padding:24px 0;border-block:1px solid var(--line);text-align:center}.stat+.stat{border-left:1px solid var(--line)}.tile{text-align:center;padding:20px 14px;border-radius:8px;box-shadow:0 3px 12px #25384b0e}.value{display:block;font-size:28px;font-weight:700;color:var(--accent);line-height:1.4;font-variant-numeric:tabular-nums}.caption{display:block;font-size:14px;line-height:1.65;color:var(--muted);margin-top:8px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#f5f7f9;border-radius:6px}code{font-family:ui-monospace,monospace;font-size:.9em}table{border-collapse:collapse;width:100%;margin:24px 0;font-size:15px}th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line)}th{font-weight:650;background:#f5f7f9}details{margin-top:42px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}.intro+details{padding:0 0 20px;border-top:0;border-bottom:1px solid var(--line)}summary{cursor:pointer;width:fit-content;color:var(--heading)}details[open] summary{margin-bottom:14px}.video-description-text{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}footer{margin-top:28px;font-size:12px;color:var(--muted)}.paper{overflow-wrap:anywhere}
@media print{body{background:white}.paper{margin:0 auto;box-shadow:none}.callout,.card,.category,.tile{break-inside:avoid}h2,h3{break-after:avoid}}
</style>
</head>
<body><main class="paper">
<header class="intro">
<h1>{{TITLE}}</h1>
<!-- 副标题可删除。题头不要放组件配额、虚构指标或装饰标签。 -->
<p class="subtitle">{{SUBTITLE}}</p>
<p class="lead">{{LEAD}}</p>
<p class="meta">{{ATTRIBUTION}}</p>
</header>
<!-- 有视频简介时，将此占位符替换为裸 details/summary；它必须与页尾来源说明共用同一套样式，不添加背景、边框、圆角或强调框。 -->
{{VIDEO_DESCRIPTION}}
<!-- 正文从语义组织生成：section/h2（span.num 放连续章节序号，后接 span 标题文本）、h3/p；可选 callout、keyline、cards/card、comparison、categories/category、ol.steps/li、stats、tiles/tile。不存在必填章节或必用组件。短项目用原生列表、表格或紧凑分栏，名称与数值同行；ol.steps 仅供需要展开解释的步骤选用，圆圈编号与布局可自行调整。p、li 或卡片用 data-source-units 绑定实际支持内容的 ID。 -->
{{BODY}}
<details><summary>来源与处理说明</summary>{{SOURCES}}</details>
<footer>精读 · 本地阅读报告</footer>
</main></body></html>
