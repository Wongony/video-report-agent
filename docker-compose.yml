name: video-report
services:
  app:
    image: video-report-agent:linux-amd64
    platform: linux/amd64
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 31m
    shm_size: 1gb
    ports:
      - "127.0.0.1:${WEB_PORT:-8765}:8765"
    environment:
      ASR_BACKEND: paraformer
      ASR_MODEL: paraformer-v2
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      PI_PROVIDER: ${PI_PROVIDER:-deepseek}
      PI_MODEL: ${PI_MODEL:-deepseek-v4-flash-vision-exp}
      PI_API_KEY: ${PI_API_KEY:?Set PI_API_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ASR_CNY_PER_SECOND: ${ASR_CNY_PER_SECOND:-}
      MEDIA_KEEP_LAST: ${MEDIA_KEEP_LAST:-20}
      MEDIA_MAX_AGE_DAYS: ${MEDIA_MAX_AGE_DAYS:-0}
    command:
      - video-report
      - --runs
      - /app/runs
      - web
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --mode
      - public
      - --public-origin
      - ${PUBLIC_ORIGIN:-http://localhost:8765}
      - --max-concurrency
      - "1"
    volumes:
      - runs:/app/runs
      - pi:/app/config/pi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  cloudflared:
    image: cloudflare/cloudflared:latest
    platform: linux/amd64
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  runs:
  pi:
